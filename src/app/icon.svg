<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Print It!">
  <!--
    The favicon (the in-app <Brand> is the wordmark alone): a 3D
    printer on a cream disc with the heavy ink keyline this design language
    uses everywhere. The disc is what keeps the black printer readable on
    dark browser tabs.

    Printer glyph: "3d printer" from Flaticon (flaticon.com/free-icon/18221504),
    embedded so the mark stays one self-contained file.
  -->
  <circle cx="16" cy="16" r="14" fill="#fff6e9" stroke="#221a14" stroke-width="3"/>
  <image x="8" y="8" width="16" height="16" href="data:image/png;base64,"/>
</svg>
