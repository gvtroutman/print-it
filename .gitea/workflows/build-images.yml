# Build images on this Gitea and publish them to its own package registry.
#
# This is the Gitea counterpart of .github/workflows/release-images.yml.
# Because this .gitea/workflows directory exists, Gitea runs only the
# workflows in here and ignores .github/workflows; GitHub ignores this one.
#
# The runner shares the Docker daemon of the box it runs on, so the registry
# is addressed as localhost:3002. Docker allows plain HTTP to localhost,
# which means no daemon configuration is needed to push or to pull.
#
# One-time setup:
#   - a Gitea Actions runner on the same box as Gitea, with the Docker socket
#   - a repository secret REGISTRY_TOKEN: a Gitea access token with
#     write:package scope
#
# Tags per image: the 7-char commit SHA always, plus a moving latest.
name: Build images

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/traffic/**"
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  images:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ppp-app
            target: runner
          - name: ppp-migrate
            target: migrator
    steps:
      - uses: actions/checkout@v4

      # The NAS disk is small and is also where the live app keeps its
      # database and uploads. Start from an empty build cache rather than
      # trusting the last run to have left room: a run that filled the disk
      # never reached its own clean-up. Cache a build is still using is
      # skipped, so the other matrix job is safe.
      - name: Make room
        run: |
          docker builder prune -af
          docker image prune -f

      - name: Build
        run: |
          set -euo pipefail
          short="${GITHUB_SHA::7}"
          image="localhost:3002/${{ github.repository_owner }}/${{ matrix.name }}"
          docker build --target "${{ matrix.target }}" -t "$image:$short" -t "$image:latest" .
          echo "IMAGE=$image" >> "$GITHUB_ENV"
          echo "SHORT=$short" >> "$GITHUB_ENV"

      - name: Push
        env:
          REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
        run: |
          set -euo pipefail
          echo "$REGISTRY_TOKEN" | docker login localhost:3002 -u "${{ github.repository_owner }}" --password-stdin
          docker push "$IMAGE:$SHORT"
          docker push "$IMAGE:latest"
          docker logout localhost:3002

      # The runner builds on the NAS's own Docker daemon, whose disk is small.
      # Every build leaves the previous :latest untagged plus a SHA-tagged copy
      # and its build cache; six builds in one afternoon filled the disk. The
      # SHA tag lives on in the registry, so drop it locally, then clear
      # untagged images (never one a container still uses) and all build
      # cache. Keeping a day of cache (the old `until=24h`) let ten pushes in
      # one day fill the disk again, at ~0.4 GB of cache each.
      - name: Clean up
        if: always()
        run: |
          docker rmi "$IMAGE:$SHORT" || true
          docker image prune -f
          docker builder prune -af

  # Point the ZimaOS compose file at the images just pushed, so the stack on
  # the NAS always names the newest build on main. It only edits the file;
  # redeploying the stack is still a separate step.
  #
  # The job's Docker is the host's, so a bind mount reaches the NAS's own
  # disk. --mount (not -v) refuses a missing source instead of quietly
  # creating an empty directory, so a moved file fails the run loudly.
  update-compose:
    needs: images
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      STACK_DIR: /DATA/AppData/print-it
      COMPOSE_FILE: docker-compose.zimaos.yml
    steps:
      - name: Pin both images to this commit
        run: |
          set -euo pipefail
          short="${GITHUB_SHA::7}"
          repo="localhost:3002/${{ github.repository_owner }}"
          # Rewrite through a temp file and cat it back, rather than sed -i,
          # so the file keeps its owner and mode and stays editable over SMB.
          docker run --rm \
            --mount "type=bind,source=$STACK_DIR,target=/stack" \
            -e REPO="$repo" -e SHORT="$short" -e FILE="/stack/$COMPOSE_FILE" \
            alpine:3 sh -euc '
              sed -E "s#(image: *$REPO/ppp-(app|migrate)):[A-Za-z0-9._-]+#\1:$SHORT#" "$FILE" > /tmp/compose.yml
              n=$(grep -cE "image: *$REPO/ppp-(app|migrate):$SHORT\$" /tmp/compose.yml || true)
              if [ "$n" != 2 ]; then
                echo "expected 2 images pinned to $SHORT, found $n; $FILE left unchanged" >&2
                exit 1
              fi
              cat /tmp/compose.yml > "$FILE"
              grep -E "image: *$REPO/" "$FILE"
            '
