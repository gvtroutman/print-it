# Build images, publish them to this Gitea's own package registry, and deploy
# them to the stack on the NAS.
#
# This is the Gitea counterpart of .github/workflows/release-images.yml.
# Because this .gitea/workflows directory exists, Gitea runs only the
# workflows in here and ignores .github/workflows; GitHub ignores this one.
#
# Two machines, two runners:
#   - `pc`: a runner on the workstation, which does the build. A build that
#     took six minutes on the NAS's four cores takes a minute or two there.
#     It pushes to the NAS's registry over the LAN.
#   - `ubuntu-latest`: the runner on the NAS itself, which shares the NAS's
#     Docker daemon and disk. It pulls the new images and swaps them in
#     (deploy/nas-deploy.sh): migrator first while the old app keeps serving,
#     then the app, which has to answer its health endpoint or the previous
#     image goes back. A service whose image did not change is left alone.
#
# The registry stays on the NAS, so the stack never depends on the
# workstation: only a new build does. A push made while the workstation is
# off waits in the queue and builds when it comes back. To deploy while it is
# offline, run this workflow manually with build_runner set to ubuntu-latest;
# the NAS then builds the images as well as deploying them.
#
# Rolling back by hand: .gitea/workflows/rollback.yml, with any earlier
# commit's short SHA. Every build stays in the registry under its SHA.
#
# One-time setup:
#   - the NAS runner, on the same box as Gitea, with the Docker socket
#   - the workstation runner, labelled `pc`, with the Docker socket; its
#     Docker lists your configured registry address under insecure-registries, because the
#     registry is plain HTTP and Docker only lets that through to localhost
#   - a repository secret REGISTRY_TOKEN: a Gitea access token with
#     write:package scope
#
# Tags per image: the 7-char commit SHA always, plus a moving latest.
name: Build images

on:
  push:
    branches: [main]
    # Nothing in these reaches an image (see .dockerignore), so a push that
    # only touches them has nothing to build or deploy.
    # An empty commit counts as touching only these, so it does not build
    # either: to rebuild without a change, re-run the last run or dispatch it.
    paths-ignore:
      - "docs/**"
      - "**.md"
      - ".github/**"
  workflow_dispatch:
    inputs:
      build_runner:
        description: "Build on pc, or use ubuntu-latest when the PC is offline"
        type: choice
        options:
          - pc
          - ubuntu-latest
        default: pc
        required: true

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ${{ vars.REGISTRY }}
  OWNER: ${{ github.repository_owner }}

jobs:
  images:
    runs-on: ${{ inputs.build_runner || 'pc' }}
    env:
      # The NAS daemon reaches its own HTTP registry through loopback. Keep
      # REGISTRY on the LAN address for size queries from the job container.
      DOCKER_REGISTRY: ${{ inputs.build_runner == 'ubuntu-latest' && 'localhost:3002' || vars.REGISTRY }}
      # The build cache (npm downloads, Next's compiler cache, unchanged
      # layers) is what makes a build fast. The NAS needs room for the latest
      # dependency layer and compiler cache: 1 GB evicted both after each build.
      # Keep this NAS limit in step with deploy/nas-deploy.sh.
      CACHE_CAP: ${{ inputs.build_runner == 'ubuntu-latest' && '4gb' || '20gb' }}
    steps:
      - uses: actions/checkout@v4

      - name: Build and push
        env:
          REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
        run: |
          export TAG="${GITHUB_SHA::7}" EXTRA_TAG=latest LABEL=build
          deploy/build-push.sh

      # The images live on in the registry; only the build cache is worth
      # keeping here.
      - name: Clean up
        if: always()
        run: |
          short="${GITHUB_SHA::7}"
          registry="${DOCKER_REGISTRY:-$REGISTRY}"
          docker rmi "$registry/$OWNER/ppp-app:$short" "$registry/$OWNER/ppp-migrate:$short" || true
          docker image prune -f
          docker builder prune -af --keep-storage "$CACHE_CAP" || true

  deploy:
    needs: images
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      REPO: localhost:3002/${{ github.repository_owner }}
      # The record copy of the compose file, which this job keeps pinned
      # alongside the live one.
      RECORD_DIR: ${{ vars.RECORD_DIR }}
      RECORD_FILE: docker-compose.zimaos.yml
      # ZimaOS's own copy, the one the stack actually runs from and the
      # dashboard shows. Editing it here keeps the dashboard truthful.
      STACK_DIR: ${{ vars.STACK_DIR }}
      PROJECT: ${{ vars.PROJECT }}
    steps:
      - uses: actions/checkout@v4

      # What is running now, from the file the stack runs from: the image
      # kept back for a quick rollback, whatever happens next.
      - name: Note the running build
        run: |
          prev=$(docker run --rm --mount "type=bind,source=$STACK_DIR,target=/stack,readonly" alpine:3 \
            sed -nE "s#^ *image: *$REPO/ppp-app:([0-9a-f]{7}) *\$#\1#p" /stack/docker-compose.yml | head -n 1)
          echo "running: ${prev:-unknown}"
          echo "PREV=$prev" >> "$GITHUB_ENV"

      - name: Link editable artwork
        id: artwork
        run: |
          docker run --rm -i \
            --mount "type=bind,source=$STACK_DIR,target=/stack" \
            --mount "type=bind,source=$RECORD_DIR/1x,target=/artwork,readonly" \
            node:22-alpine node - /stack/docker-compose.yml "$RECORD_DIR/1x" < deploy/link-artwork.cjs >> "$GITHUB_OUTPUT"

      - name: Deploy
        env:
          REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
          FORCE_RECREATE_APP: ${{ steps.artwork.outputs.changed }}
        run: |
          export TAG="${GITHUB_SHA::7}" STRATEGY=incremental
          deploy/nas.sh

      - name: Verify linked artwork
        run: |
          docker exec ppp-app node -e '
            const fs = require("node:fs");
            if (process.env.ARTWORK_ROOT !== "/artwork") throw new Error("Artwork folder is not configured");
            const files = { "print-it-wordmark-arched.png": "Asset 8.2.png", "print-it-wordmark-straight.png": "Asset 5.2.png", "print-it-star.png": "Asset 6.2.png" };
            (async () => {
              for (const [name, source] of Object.entries(files)) {
                const path = "/artwork/" + source;
                const expected = fs.readFileSync(fs.existsSync(path) ? path : "/app/public/" + name);
                const response = await fetch("http://127.0.0.1:3000/artwork/" + name);
                if (!response.ok || !response.headers.get("cache-control")?.includes("no-store") || !Buffer.from(await response.arrayBuffer()).equals(expected)) {
                  throw new Error("Linked artwork check failed: " + source);
                }
              }
              console.log("All three linked artwork files are readable and served without caching.");
            })().catch(error => { console.error(error.message); process.exitCode = 1; });
          '

      # The record copy follows only a deploy that succeeded, so it always
      # names what is running. --mount (not -v) refuses a missing source
      # instead of quietly creating an empty directory.
      - name: Pin the record copy
        run: |
          set -euo pipefail
          short="${GITHUB_SHA::7}"
          docker run --rm \
            --mount "type=bind,source=$RECORD_DIR,target=/stack" \
            -e REPO="$REPO" -e SHORT="$short" -e FILE="/stack/$RECORD_FILE" \
            alpine:3 sh -euc '
              sed -E "s#(image: *$REPO/ppp-(app|migrate)):[A-Za-z0-9._-]+#\1:$SHORT#" "$FILE" > /tmp/compose.yml
              n=$(grep -cE "image: *$REPO/ppp-(app|migrate):$SHORT\$" /tmp/compose.yml || true)
              if [ "$n" != 2 ]; then
                echo "expected 2 images pinned to $SHORT, found $n; $FILE left unchanged" >&2
                exit 1
              fi
              cat /tmp/compose.yml > "$FILE"
            '

      # The NAS disk is small and also holds the live database and uploads.
      # Keep the running build and the one before it, so a rollback to the
      # last good build starts without a pull; every older SHA-tagged ppp
      # image goes (docker rmi refuses one a container still uses). Only
      # 7-hex SHA tags are touched, never a benchmark's or anything else.
      - name: Drop older images
        if: always()
        run: |
          short="${GITHUB_SHA::7}"
          docker images --format '{{.Repository}}:{{.Tag}}' \
            | grep -E "^$REPO/ppp-(app|migrate):[0-9a-f]{7}\$" \
            | grep -vE ":($short|${PREV:-none})\$" \
            | xargs -r docker rmi 2> /dev/null || true
          docker image prune -f
