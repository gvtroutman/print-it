# Throwaway stack for deploy/bench: the production stack's shape (migrator,
# app, Postgres, same health check, same pull policy) with nothing worth
# keeping. Postgres and the uploads live in tmpfs and a scratch volume, no
# port is published, and the whole project is removed after each run.
#
# __BENCH_SECRET__ is filled in per run by deploy/bench/deploy.sh, and the
# image tags are pinned by nas-deploy.sh exactly as on the real stack.

x-ppp-env: &ppp-env
  BETTER_AUTH_SECRET: "__BENCH_SECRET__"
  DATABASE_URL: "postgresql://ppp:bench@db:5432/ppp?schema=public"
  BETTER_AUTH_URL: "https://bench.invalid"
  APP_URL: "https://bench.invalid"
  PASSKEY_RP_ID: "bench.invalid"
  PASSKEY_RP_NAME: "Print It! bench"
  ADMIN_EMAIL: "bench@bench.invalid"
  ADMIN_NAME: "Bench"
  MODELS_ROOT: /uploads
  HIBP_DISABLED: "true"

services:
  migrate:
    pull_policy: always
    image: localhost:3002/gvtroutman/ppp-migrate:bench-init
    environment:
      <<: *ppp-env
    volumes:
      - uploads:/uploads
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  app:
    pull_policy: always
    image: localhost:3002/gvtroutman/ppp-app:bench-init
    restart: unless-stopped
    environment:
      <<: *ppp-env
    volumes:
      - uploads:/uploads
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ppp
      POSTGRES_PASSWORD: bench
      POSTGRES_DB: ppp
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ppp -d ppp"]
      interval: 2s
      timeout: 5s
      retries: 30

volumes:
  uploads: {}
