<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#fff6e9">
  <title>Print It! · Reconnect</title>
  <link rel="stylesheet" href="/pwa/offline.css">
  <script src="/pwa/offline.js" defer></script>
</head>
<body>
  <main>
    <img class="brand" src="/print-it-wordmark-arched.png" width="280" height="76" alt="Print It!">
    <h1>You’re offline</h1>
    <p>Reconnect to open Print It! and add filament to your market catalog.</p>
    <p id="shared-message" hidden>Your shared link is still in this window. Keep it open, then retry when you’re connected.</p>
    <p id="shared-link" hidden></p>
    <button type="button" id="retry">Try again</button>
    <p class="small">The listing has not been saved yet.</p>
  </main>
</body>
</html>
